name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, e.g. v0.1.0'
        required: true

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Work out the version
        id: version
        shell: bash
        run: echo "value=${GITHUB_REF_NAME:-${{ github.event.inputs.version }}}" >> "$GITHUB_OUTPUT"

      - name: Build the web bundle
        working-directory: web
        run: |
          npm ci
          npm run build

      # One static binary with the web app embedded in it. No runtime, no container, no
      # separate database server -- the shortest possible path to "download one file and
      # run it" (docs/design.md §1).
      - name: Build the binary
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build -trimpath -ldflags "-s -w -X main.version=${{ steps.version.outputs.value }}" -o dist/porta.exe ./cmd/porta

      # TODO: signing. An unsigned download triggers SmartScreen, and that dialog is the
      # install wall this project exists to avoid. The route is not decided yet -- see
      # issue #33 and docs/tech-stack.md §9. Until it is, the release is unsigned and the
      # five-minute install test (issue #35) will include a "More info -> Run anyway" step.

      - name: Build the installer
        run: |
          iscc /DMyAppVersion="${{ steps.version.outputs.value }}" installer\porta.iss

      - uses: actions/upload-artifact@v4
        with:
          name: porta-di-ferro-windows
          path: installer/Output/*.exe

      - name: Publish to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: installer/Output/*.exe
          generate_release_notes: false
          body: |
            Download the installer below and run it. Nothing else needs installing first.

            <!-- Release notes are written for organizers, not developers: what changed for
                 a club volunteer deciding whether to upgrade before Saturday. Fill this in
                 before publishing (docs/design.md §1). -->
