name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache: true

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # The TypeScript match engine runs the same vectors in testdata/vectors/ as the Go
      # one. A vector that passes in one implementation and fails in the other fails here,
      # which is the only thing holding the two engines together.
      - name: TypeScript engine and vector parity
        working-directory: web
        run: npm test

      - name: Type check the frontend
        working-directory: web
        run: npm run check

      # Built before the Go tests, because //go:embed needs the bundle and the e2e suite
      # runs against the real binary.
      - name: Build the web bundle
        working-directory: web
        run: npm run build

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Go engine, vectors, properties and end to end
        run: go test ./...

      # A cgo dependency would turn one-command cross-compilation back into a toolchain
      # problem, so every run proves the Windows target still builds without one.
      - name: Cross-compile the Windows target
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: go build ./...

      # The number a phone downloads joining cold on venue wifi. Printed on every run so a
      # regression is visible here rather than at an event (docs/tech-stack.md §11).
      - name: Cold-load budget
        working-directory: web
        run: |
          echo "### Cold-load budget" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          for f in dist/index.html dist/assets/*; do
            raw=$(wc -c < "$f")
            gz=$(gzip -9 -c "$f" | wc -c)
            printf '%-40s %8s B  %8s B gzipped\n' "$(basename "$f")" "$raw" "$gz" >> "$GITHUB_STEP_SUMMARY"
          done
          total=$(cat dist/index.html dist/assets/* | gzip -9 -c | wc -c)
          echo "" >> "$GITHUB_STEP_SUMMARY"
          printf 'total %s B gzipped\n' "$total" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
